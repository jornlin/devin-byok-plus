<!-- 系统补丁 Tab -->
<div class="card" style="margin-bottom:12px">
    <div class="card-head between">
        <span>插件信息</span>
        <span class="badge badge-ok" id="pluginVersionBadge">v{{pluginVersion}}</span>
    </div>
    <div class="plugin-info">
        <div class="plugin-info-row">
            <b>当前安装版本</b>
            <div class="plugin-info-value">
                <code id="pluginInstalledVersion">v{{pluginVersion}}</code>
                <!-- 有新版本时由 sidebar.js 填充"可更新 vX.Y.Z"徽标 -->
                <span id="pluginUpdateTag" class="plugin-update-tag hidden"
                      data-ws-action="openReleaseUrl" role="button" tabindex="0"
                      title="前往 GitHub 下载新版本"></span>
            </div>
        </div>
        <div class="plugin-info-row">
            <b>代码仓库</b>
            <div class="plugin-info-value">
                <a class="plugin-info-link" id="pluginRepoLink"
                   data-ws-action="openRepoUrl" role="button" tabindex="0"
                   title="在浏览器中打开仓库">{{pluginRepoUrl}}</a>
            </div>
        </div>
        <div class="plugin-info-row">
            <b>Git 远端地址</b>
            <code id="pluginGitRemote">{{pluginGitRemote}}</code>
        </div>
    </div>
    <div class="plugin-info-actions">
        <button type="button" class="btn btn-s sm" data-ws-action="checkVersionUpdate"
                id="btnCheckUpdate">检查更新</button>
        <button type="button" class="btn btn-s sm" data-ws-action="openRepoUrl">前往仓库</button>
        <button type="button" class="btn btn-s sm" data-ws-action="openReleaseUrl">下载最新版</button>
    </div>
    <div id="pluginUpdateHint" class="plugin-update-hint hidden"></div>
</div>
<div class="card" style="margin-bottom:12px">
    <div class="card-head between">
        <span>补丁管理</span>
        <span id="patchBadge" class="badge {{patchBadgeClass}}">{{patchBadgeText}}</span>
    </div>
    <input type="hidden" id="patchApiUrl" value="{{patchApiUrl}}">
    <input type="hidden" id="patchInferenceUrl" value="{{patchInferenceUrl}}">
    <div id="patchPathDisplay" class="patch-path">{{patchPathDisplay}}</div>
    <div class="btns" style="margin-bottom:8px">
        <button type="button" class="btn btn-s sm" data-ws-action="locateExtJs">选择路径</button>
        <button type="button" class="btn btn-s sm" data-ws-action="clearExtJsPath">自动检测</button>
        <button type="button" class="btn btn-s sm" data-ws-action="refreshPatchStatus">刷新状态</button>
    </div>
    <div class="btns" id="patchActionButtons">
        <button type="button" class="btn btn-p sm" data-ws-action="applyPatch">安装补丁</button>
        <button type="button" class="btn btn-s sm" data-ws-action="revertPatch">还原</button>
    </div>
    <div id="patchActionState" class="action-state hidden">
        <div id="patchActionText" class="action-text"></div>
        <div class="action-progress"><div class="action-progress-bar"></div></div>
    </div>
</div>
